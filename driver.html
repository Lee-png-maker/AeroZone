
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AeroZone Driver</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111;
}

header{
background:#000;
color:#fff;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:1000;
}

button{
padding:12px 16px;
border:0;
border-radius:10px;
font-weight:900;
cursor:pointer;
margin-top:8px;
}

.black{
background:#000;
color:#fff;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.login{
max-width:400px;
margin:80px auto;
background:#fff;
padding:25px;
border-radius:20px;
}

input{
width:100%;
padding:13px;
margin:8px 0 15px;
border:1px solid #ccc;
border-radius:10px;
}

.dashboard{
display:none;
}

.order{
background:#fff;
padding:20px;
border-radius:18px;
margin:15px 0;
box-shadow:0 5px 20px #0001;
}

.status{
display:inline-block;
background:#eee;
padding:7px 10px;
border-radius:20px;
font-weight:800;
}

.pin{
font-size:30px;
font-weight:1000;
letter-spacing:5px;
}

</style>

</head>

<body>

<header>

<div class="logo">
AeroZone Driver
</div>

<button onclick="logout()">
Logout
</button>

</header>

<div id="loginScreen" class="login">

<h2>Driver Login</h2>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Password">

<button class="black"
style="width:100%"
onclick="login()">
Login
</button>

<p id="message"></p>

</div>

<div id="dashboard" class="dashboard">

<div class="container">

<h1>My Deliveries</h1>

<div id="orders"></div>

</div>

</div>

<script type="module">

import {
auth,
db,
ref,
get,
update,
onValue,
onAuthStateChanged,
signInWithEmailAndPassword,
signOut
} from "./firebase.js";

window.login=async function(){

try{

await signInWithEmailAndPassword(
auth,
document.getElementById("email").value.trim(),
document.getElementById("password").value
);

}catch(e){

document.getElementById("message").textContent=e.message;

}

};

window.logout=function(){
signOut(auth);
};

onAuthStateChanged(auth,async user=>{

if(!user){

document.getElementById("loginScreen").style.display="block";
document.getElementById("dashboard").style.display="none";

return;

}

const snap=await get(ref(db,"users/"+user.uid));

if(!snap.exists() || snap.val().role!=="driver"){

alert("This account is not a driver account.");
await signOut(auth);
return;

}

document.getElementById("loginScreen").style.display="none";
document.getElementById("dashboard").style.display="block";

loadOrders(user.uid);

});

function loadOrders(uid){

onValue(ref(db,"orders"),snapshot=>{

const box=document.getElementById("orders");

box.innerHTML="";

if(!snapshot.exists()){

box.innerHTML="<p>No deliveries.</p>";
return;

}

Object.values(snapshot.val())
.filter(order=>order.driverId===uid)
.filter(order=>
order.status==="ready_for_driver" ||
order.status==="out_for_delivery"
)
.forEach(order=>{

const div=document.createElement("div");

div.className="order";

div.innerHTML=`

<h2>${escapeHtml(order.orderId)}</h2>

<span class="status">
${escapeHtml(order.status)}
</span>

<p>
<b>Customer:</b>
${escapeHtml(order.customerName)}
</p>

<p>
<b>Phone:</b>
${escapeHtml(order.customerPhone)}
</p>

<p>
<b>Delivery address:</b>
${escapeHtml(order.deliveryAddress)}
</p>

<button class="black"
onclick="startDelivery('${order.orderId}')">
Start Delivery
</button>

<button
onclick="completeDelivery('${order.orderId}')">
Complete Delivery
</button>

`;

box.appendChild(div);

});

});

}

window.startDelivery=async function(orderId){

await update(
ref(db,"orders/"+orderId),
{
status:"out_for_delivery",
updatedAt:Date.now()
}
);

alert("Delivery started.");

};

window.completeDelivery=async function(orderId){

const pin=prompt(
"Enter the customer's 6-digit delivery PIN:"
);

if(!pin) return;

const snap=await get(ref(db,"orders/"+orderId));

if(!snap.exists()) return;

const order=snap.val();

if(String(pin)!==String(order.deliveryPin)){

alert("Incorrect delivery PIN.");
return;

}

await update(
ref(db,"orders/"+orderId),
{
status:"delivered",
deliveredAt:Date.now(),
updatedAt:Date.now()
}
);

alert("Delivery completed successfully.");

};

function escapeHtml(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

</script>

</body>

</html>
