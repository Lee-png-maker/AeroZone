<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AeroZone | Online Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6f8;
  color:#222;
}
header{
  background:#111827;
  color:white;
  position:sticky;
  top:0;
  z-index:1000;
}
.top{
  max-width:1200px;
  margin:auto;
  padding:15px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}
.logo{
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}
.logo span{color:#38bdf8}
.search{
  flex:1;
}
.search input{
  width:100%;
  padding:12px 16px;
  border:0;
  border-radius:8px;
  font-size:15px;
  outline:none;
}
.cartBtn{
  background:#38bdf8;
  color:#111827;
  border:0;
  padding:11px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}
nav{
  background:white;
  border-bottom:1px solid #ddd;
  overflow-x:auto;
}
.categories{
  max-width:1200px;
  margin:auto;
  display:flex;
  gap:8px;
  padding:10px 20px;
}
.categories button{
  border:1px solid #ddd;
  background:white;
  padding:9px 15px;
  border-radius:20px;
  cursor:pointer;
  white-space:nowrap;
}
.categories button.active,
.categories button:hover{
  background:#111827;
  color:white;
}
.hero{
  max-width:1200px;
  margin:20px auto;
  padding:45px 25px;
  border-radius:15px;
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
}
.hero h1{
  font-size:42px;
  margin-bottom:10px;
}
.hero p{
  font-size:18px;
  opacity:.9;
}
main{
  max-width:1200px;
  margin:auto;
  padding:10px 20px 50px;
}
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  transition:.2s;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 5px 18px rgba(0,0,0,.13);
}
.productImage{
  width:100%;
  height:210px;
  object-fit:cover;
  background:#eee;
}
.info{
  padding:14px;
}
.category{
  color:#777;
  font-size:12px;
  margin-bottom:7px;
}
.name{
  font-size:16px;
  font-weight:bold;
  min-height:40px;
}
.price{
  font-size:21px;
  font-weight:bold;
  margin:10px 0;
}
.add{
  width:100%;
  border:0;
  background:#111827;
  color:white;
  padding:11px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}
.add:hover{background:#2563eb}
.empty{
  text-align:center;
  padding:50px;
  grid-column:1/-1;
}
.cart{
  position:fixed;
  right:-420px;
  top:0;
  width:390px;
  max-width:95%;
  height:100vh;
  background:white;
  z-index:2000;
  box-shadow:-5px 0 20px rgba(0,0,0,.2);
  transition:.3s;
  display:flex;
  flex-direction:column;
}
.cart.open{right:0}
.cartHead{
  padding:18px;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close{
  border:0;
  background:none;
  font-size:25px;
  cursor:pointer;
}
.cartItems{
  flex:1;
  overflow:auto;
  padding:15px;
}
.cartItem{
  display:flex;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:12px 0;
}
.cartItem img{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:7px;
}
.cartInfo{flex:1}
.qty{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
}
.qty button{
  width:27px;
  height:27px;
  border:1px solid #ddd;
  background:white;
  cursor:pointer;
}
.remove{
  color:#dc2626;
  border:0;
  background:none;
  cursor:pointer;
  margin-left:8px;
}
.cartBottom{
  padding:18px;
  border-top:1px solid #ddd;
}
.total{
  display:flex;
  justify-content:space-between;
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}
.whatsapp{
  display:block;
  width:100%;
  text-align:center;
  padding:13px;
  border-radius:8px;
  background:#25D366;
  color:white;
  text-decoration:none;
  font-weight:bold;
}
footer{
  background:#111827;
  color:white;
  text-align:center;
  padding:30px 20px;
}
@media(max-width:900px){
  .products{grid-template-columns:repeat(3,1fr)}

@media(max-width:650px){
  .top{flex-wrap:wrap}
  .logo{width:100%}
  .search{order:3;flex-basis:100%}
  .products{grid-template-columns:repeat(2,1fr);gap:10px}
  .productImage{height:170px}
  .hero h1{font-size:30px}
  .hero{padding:30px 20px}

@media(max-width:400px){

  .productImage{height:145px}
  .name{font-size:14px}
  .price{font-size:18px}
}
</style>

/* =========================================================
   STORE FUNCTIONS
========================================================= */

let selectedCategory = "All";

let cart = JSON.parse(localStorage.getItem("aerozoneCart")) || [];


/* CREATE CATEGORY BUTTONS */

function createCategories(){

  const container = document.getElementById("categories");

  const categories = [
    "All",
    ...new Set(products.map(p => p.category))
  ];

  container.innerHTML = categories.map(category => `
    <button
      class="${category === selectedCategory ? "active" : ""}"
      onclick="selectCategory('${category}')">
      ${category}
    </button>
  `).join("");
}


/* SELECT CATEGORY */

function selectCategory(category){

  selectedCategory = category;

  createCategories();

  displayProducts();
}


/* DISPLAY PRODUCTS */

function displayProducts(){

  const container = document.getElementById("products");

  const search =
    document.getElementById("search").value
    .toLowerCase()
    .trim();

  let filtered = products.filter(product => {

    const matchesCategory =
      selectedCategory === "All" ||
      product.category === selectedCategory;

    const matchesSearch =
      product.name.toLowerCase().includes(search);

    return matchesCategory && matchesSearch;

  });

  if(filtered.length === 0){

    container.innerHTML = `
      <div class="empty">
        <h2>No products found</h2>
        <p>Try another search.</p>
      </div>
    `;

    return;
  }

  container.innerHTML = filtered.map((product,index) => `

    <div class="card">

      <img
        class="productImage"
        src="${product.image}"
        alt="${product.name}"
        onerror="this.src='https://placehold.co/600x600?text=AeroZone'">

      <div class="info">

        <div class="category">
          ${product.category}
        </div>

        <div class="name">
          ${product.name}
        </div>

        <div class="price">
          R${product.price}
        </div>

        <button
          class="add"
          onclick="addToCart('${product.name}')">
          Add to Cart
        </button>

      </div>

    </div>

  `).join("");
}


/* ADD TO CART */

function addToCart(name){

  const product = products.find(p => p.name === name);

  if(!product) return;

  const existing = cart.find(item => item.name === name);

  if(existing){

    existing.qty++;

  }else{

    cart.push({
      ...product,
      qty:1
    });

  }

  saveCart();

  updateCart();

  openCart();
}


/* REMOVE PRODUCT */

function removeFromCart(name){

  cart = cart.filter(item => item.name !== name);

  saveCart();

  updateCart();
}


/* CHANGE QUANTITY */

function changeQty(name, amount){

  const item = cart.find(item => item.name === name);

  if(!item) return;

  item.qty += amount;

  if(item.qty <= 0){

    removeFromCart(name);

    return;
  }

  saveCart();

  updateCart();
}


/* SAVE CART */

function saveCart(){

  localStorage.setItem(
    "aerozoneCart",
    JSON.stringify(cart)
  );

}


/* UPDATE CART */

function updateCart(){

  const container =
    document.getElementById("cartItems");

  if(cart.length === 0){

    container.innerHTML = `
      <div style="text-align:center;padding:40px 10px">
        <h3>Your cart is empty</h3>
        <p>Add products to your cart.</p>
      </div>
    `;

  }else{

    container.innerHTML = cart.map(item => `

      <div class="cartItem">

        <img
          src="${item.image}"
          onerror="this.src='https://placehold.co/100x100?text=Product'">

        <div class="cartInfo">

          <strong>${item.name}</strong>

          <div>
            R${item.price}
          </div>

          <div class="qty">

            <button
              onclick="changeQty('${item.name}',-1)">
              −
            </button>

            <span>${item.qty}</span>

            <button
              onclick="changeQty('${item.name}',1)">
              +
            </button>

            <button
              class="remove"
              onclick="removeFromCart('${item.name}')">
              Remove
            </button>

          </div>

        </div>

      </div>

    `).join("");

  }


  let total = 0;
  let count = 0;

  cart.forEach(item => {

    total += item.price * item.qty;

    count += item.qty;

  });


  document.getElementById("cartTotal").textContent =
    total.toLocaleString("en-ZA");

  document.getElementById("cartCount").textContent =
    count;


  createWhatsAppLink();

}


/* WHATSAPP ORDER */

function createWhatsAppLink(){

  const phone = "27000000000";

  if(cart.length === 0){

    document.getElementById("whatsappOrder").href = "#";

    return;

  }

  let message =
    "Hello AeroZone, I would like to order:%0A%0A";

  let total = 0;

  cart.forEach(item => {

    const subtotal = item.price * item.qty;

    total += subtotal;

    message +=
      `${item.name} x${item.qty} - R${subtotal}%0A`;

  });

  message +=
    `%0ATotal: R${total}`;

  document.getElementById("whatsappOrder").href =
    `https://wa.me/${phone}?text=${message}`;

}


/* OPEN CART */

function openCart(){

  document
    .getElementById("cart")
    .classList.add("open");

}


/* CLOSE CART */

function closeCart(){

  document
    .getElementById("cart")
    .classList.remove("open");

}


/* START STORE */

createCategories();

displayProducts();

updateCart();

</script>
