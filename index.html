<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AeroZone | Shop Smart. Shop AeroZone.</title>

<meta name="description"
      content="AeroZone - Shop trending tech, gadgets, car accessories, home products, beauty, pet essentials and outdoor products in South Africa.">

<meta name="theme-color" content="#111827">

<script src="https://cdn.tailwindcss.com"></script>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:#f5f7fb;
    color:#111827;
}

button,
input,
select{
    font:inherit;
}

.no-scroll{
    overflow:hidden;
}

/* =========================
   HEADER
========================= */

.topbar{
    background:#111827;
    color:#fff;
    font-size:13px;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.header-inner{
    max-width:1500px;
    margin:auto;
    padding:14px 18px;
    display:flex;
    align-items:center;
    gap:18px;
}

.logo{
    min-width:max-content;
    font-size:26px;
    font-weight:900;
    letter-spacing:-1px;
    color:#111827;
}

.logo span{
    color:#2563eb;
}

.search-box{
    flex:1;
    position:relative;
}

.search-box input{
    width:100%;
    border:1px solid #d1d5db;
    background:#f9fafb;
    border-radius:12px;
    padding:13px 48px 13px 16px;
    outline:none;
    transition:.2s;
}

.search-box input:focus{
    border-color:#2563eb;
    background:#fff;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.search-icon{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    color:#6b7280;
}

.cart-button{
    position:relative;
    border:0;
    background:#2563eb;
    color:#fff;
    border-radius:12px;
    padding:12px 17px;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
}

.cart-count{
    position:absolute;
    right:-7px;
    top:-8px;
    width:23px;
    height:23px;
    border-radius:50%;
    background:#ef4444;
    color:#fff;
    font-size:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

/* =========================
   HERO
========================= */

.hero{
    background:
        radial-gradient(circle at 80% 20%,rgba(59,130,246,.35),transparent 35%),
        linear-gradient(135deg,#111827,#1e3a8a);
    color:#fff;
}

.hero-inner{
    max-width:1500px;
    margin:auto;
    padding:52px 18px;
}

.hero h1{
    margin:0;
    font-size:clamp(34px,5vw,64px);
    line-height:1;
    font-weight:950;
    letter-spacing:-2px;
}

.hero p{
    max-width:650px;
    margin:18px 0 0;
    color:#dbeafe;
    font-size:18px;
    line-height:1.6;
}

.hero-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:26px;
}

.hero-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:13px 20px;
    border-radius:10px;
    font-weight:800;
    text-decoration:none;
}

.hero-primary{
    background:#fff;
    color:#1d4ed8;
}

.hero-secondary{
    border:1px solid rgba(255,255,255,.3);
    color:#fff;
    background:rgba(255,255,255,.08);
}

/* =========================
   CATEGORY BAR
========================= */

.categories{
    background:#fff;
    border-bottom:1px solid #e5e7eb;
}

.category-inner{
    max-width:1500px;
    margin:auto;
    padding:13px 18px;
    display:flex;
    gap:9px;
    overflow-x:auto;
    scrollbar-width:none;
}

.category-inner::-webkit-scrollbar{
    display:none;
}

.category-btn{
    border:1px solid #e5e7eb;
    background:#fff;
    color:#374151;
    border-radius:999px;
    padding:9px 15px;
    white-space:nowrap;
    cursor:pointer;
    font-size:13px;
    font-weight:750;
    transition:.2s;
}

.category-btn:hover,
.category-btn.active{
    background:#2563eb;
    color:#fff;
    border-color:#2563eb;
}

/* =========================
   STORE
========================= */

.store{
    max-width:1500px;
    margin:auto;
    padding:28px 18px 70px;
}

.store-heading{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:15px;
    margin-bottom:20px;
}

.store-heading h2{
    margin:0;
    font-size:27px;
    font-weight:900;
    letter-spacing:-.7px;
}

.result-count{
    color:#6b7280;
    font-size:14px;
}

/* =========================
   PRODUCT GRID
========================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
}

@media(min-width:700px){
    .product-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:16px;
    }
}

@media(min-width:1000px){
    .product-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }
}

@media(min-width:1300px){
    .product-grid{
        grid-template-columns:repeat(5,minmax(0,1fr));
    }
}

/* =========================
   PRODUCT CARD
========================= */

.product-card{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease;
}

.product-card:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(15,23,42,.10);
    border-color:#dbeafe;
}

.product-image-wrap{
    position:relative;
    aspect-ratio:1/1;
    background:#f8fafc;
    overflow:hidden;
}

.product-image{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .45s ease;
}

.product-card:hover .product-image{
    transform:scale(1.045);
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    z-index:2;
    background:#111827;
    color:#fff;
    border-radius:7px;
    padding:5px 8px;
    font-size:10px;
    font-weight:900;
    letter-spacing:.3px;
}

.badge.popular{
    background:#ef4444;
}

.badge.new{
    background:#2563eb;
}

.wishlist{
    position:absolute;
    top:9px;
    right:9px;
    z-index:2;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid #e5e7eb;
    background:rgba(255,255,255,.95);
    cursor:pointer;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:.2s;
}

.wishlist:hover{
    transform:scale(1.08);
}

.product-body{
    padding:12px;
    display:flex;
    flex-direction:column;
    flex:1;
}

.product-category{
    font-size:11px;
    color:#6b7280;
    font-weight:750;
    text-transform:uppercase;
    letter-spacing:.35px;
    margin-bottom:5px;
}

.product-name{
    font-size:14px;
    line-height:1.35;
    font-weight:800;
    color:#111827;
    min-height:38px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.product-bottom{
    margin-top:auto;
    padding-top:12px;
}

.price{
    font-size:20px;
    font-weight:950;
    color:#111827;
    letter-spacing:-.4px;
}

.stock{
    color:#16a34a;
    font-size:11px;
    font-weight:750;
    margin-top:4px;
}

.add-btn{
    width:100%;
    margin-top:10px;
    border:0;
    background:#2563eb;
    color:#fff;
    border-radius:9px;
    padding:11px 10px;
    font-weight:850;
    cursor:pointer;
    transition:.2s;
}

.add-btn:hover{
    background:#1d4ed8;
}

.add-btn:active{
    transform:scale(.98);
}

/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;
    text-align:center;
    background:#fff;
    border:1px dashed #d1d5db;
    border-radius:16px;
    padding:60px 20px;
    color:#6b7280;
}

.empty strong{
    display:block;
    color:#111827;
    font-size:20px;
    margin-bottom:8px;
}

/* =========================
   CART DRAWER
========================= */

.cart-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.52);
    z-index:300;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.cart-overlay.open{
    opacity:1;
    pointer-events:auto;
}

.cart-drawer{
    position:absolute;
    top:0;
    right:0;
    height:100%;
    width:min(440px,94vw);
    background:#fff;
    transform:translateX(100%);
    transition:.28s ease;
    display:flex;
    flex-direction:column;
}

.cart-overlay.open .cart-drawer{
    transform:translateX(0);
}

.cart-head{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.cart-head h2{
    margin:0;
    font-size:21px;
    font-weight:900;
}

.close-cart{
    border:0;
    background:#f3f4f6;
    width:36px;
    height:36px;
    border-radius:50%;
    cursor:pointer;
    font-size:20px;
}

.cart-items{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.cart-item{
    display:flex;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #f0f0f0;
}

.cart-item-img{
    width:72px;
    height:72px;
    object-fit:cover;
    border-radius:10px;
    background:#f3f4f6;
    flex-shrink:0;
}

.cart-item-info{
    min-width:0;
    flex:1;
}

.cart-item-name{
    font-size:14px;
    font-weight:800;
    line-height:1.35;
}

.cart-item-price{
    margin-top:5px;
    font-weight:900;
}

.qty-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:8px;
}

.qty-btn{
    width:28px;
    height:28px;
    border:1px solid #d1d5db;
    border-radius:7px;
    background:#fff;
    cursor:pointer;
    font-weight:900;
}

.remove-btn{
    border:0;
    background:none;
    color:#ef4444;
    cursor:pointer;
    font-size:12px;
    margin-left:5px;
}

.cart-footer{
    border-top:1px solid #e5e7eb;
    padding:18px;
}

.subtotal-row{
    display:flex;
    justify-content:space-between;
    font-size:17px;
    font-weight:900;
}

.checkout-btn{
    width:100%;
    margin-top:13px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:#fff;
    padding:15px;
    font-weight:900;
    cursor:pointer;
}

.checkout-btn:hover{
    background:#1d4ed8;
}

.checkout-note{
    margin:10px 0 0;
    text-align:center;
    font-size:11px;
    color:#6b7280;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translate(-50%,20px);
    background:#111827;
    color:#fff;
    padding:12px 18px;
    border-radius:10px;
    font-size:14px;
    font-weight:750;
    z-index:500;
    opacity:0;
    pointer-events:none;
    transition:.25s;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   FOOTER
========================= */

footer{
    background:#111827;
    color:#d1d5db;
    text-align:center;
    padding:35px 18px;
}

footer strong{
    color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .topbar{
        text-align:center;
        padding:7px 10px;
    }

    .header-inner{
        padding:11px;
        gap:9px;
        flex-wrap:wrap;
    }

    .logo{
        font-size:23px;
    }

    .search-box{
        order:3;
        flex-basis:100%;
    }

    .cart-button{
        padding:10px 13px;
    }

    .hero-inner{
        padding:38px 16px;
    }

    .hero p{
        font-size:15px;
    }

    .store{
        padding:22px 11px 50px;
    }

    .store-heading h2{
        font-size:22px;
    }

    .result-count{
        font-size:12px;
    }

    .product-body{
        padding:10px;
    }

    .product-name{
        font-size:13px;
    }

    .price{
        font-size:18px;
