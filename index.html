<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroZone | Online Store</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
header{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:100}
.top{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center}
.logo{font-size:25px;font-weight:bold;white-space:nowrap}
.search{flex:1;padding:12px;border:0;border-radius:7px;font-size:15px}
button{cursor:pointer;border:0;border-radius:7px;padding:10px}
.cartBtn{background:#f59e0b;font-weight:bold}
nav{background:#fff;padding:10px;overflow:auto;white-space:nowrap}
nav button{margin:3px;background:#eee}
nav button:hover{background:#111827;color:#fff}
.hero{max-width:1200px;margin:20px auto;padding:40px 20px;background:#1f2937;color:#fff;border-radius:12px}
.hero h1{font-size:38px;margin:0 0 10px}
.container{max-width:1200px;margin:auto;padding:10px 15px}
.products{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 7px #ddd}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.info{padding:12px}
.cat{font-size:12px;color:#777}
.name{height:40px;font-weight:bold}
.price{font-size:20px;font-weight:bold;margin:8px 0}
.add{width:100%;background:#111827;color:#fff}
.add:hover{background:#f59e0b;color:#111}
.drawer{position:fixed;right:-400px;top:0;width:380px;max-width:95%;height:100%;background:#fff;z-index:200;box-shadow:-5px 0 20px #999;transition:.25s;display:flex;flex-direction:column}
.drawer.open{right:0}
.cartHead{background:#111827;color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}
.cartHead button{font-size:20px}
.items{flex:1;overflow:auto;padding:15px}
.item{display:flex;gap:10px;border-bottom:1px solid #ddd;padding:10px 0}
.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
.item div{flex:1}
.item button{padding:5px;margin-top:5px;color:#b91c1c}
.bottom{padding:15px;border-top:1px solid #ddd}
.checkout{width:100%;background:#16a34a;color:#fff;font-weight:bold}
footer{background:#111827;color:#fff;text-align:center;padding:25px;margin-top:30px}

@media(max-width:1000px){
.products{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:700px){
.products{grid-template-columns:repeat(2,1fr);gap:10px}
.top{flex-wrap:wrap}
.search{order:3;flex-basis:100%}
.hero h1{font-size:30px}
.card img{height:150px}
}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo">AeroZone</div>

<input
id="search"
class="search"
type="search"
placeholder="Search products..."
>

<button class="cartBtn" onclick="openCart()">
🛒 Cart (<span id="count">0</span>)
</button>
</div>
</header>

<nav>
<button onclick="filterProducts('All')">All</button>
<button onclick="filterProducts('Electronics')">Electronics</button>
<button onclick="filterProducts('Home')">Home</button>
<button onclick="filterProducts('Automotive')">Automotive</button>
<button onclick="filterProducts('Kitchen')">Kitchen</button>
<button onclick="filterProducts('Beauty')">Beauty</button>
<button onclick="filterProducts('Pets')">Pets</button>
<button onclick="filterProducts('Outdoor')">Outdoor</button>
<button onclick="filterProducts('Travel')">Travel</button>
</nav>

<section class="hero">
<h1>Shop Smart with AeroZone</h1>
<p>Trending products at great prices.</p>
</section>

<main class="container">
<h2>Products</h2>
<div id="products" class="products"></div>
</main>

<div id="drawer" class="drawer">

<div class="cartHead">
<h2>🛒 Your Cart</h2>
<button onclick="closeCart()">✕</button>
</div>

<div id="items" class="items"></div>

<div class="bottom">
<h2>Total: R<span id="total">0.00</span></h2>
<button class="checkout" onclick="checkout()">
Order on WhatsApp
</button>
</div>

</div>

<footer>
<h2>AeroZone</h2>
<p>Online shopping made simple.</p>
<p>© 2026 AeroZone</p>
</footer>

/* =================================
   AUTOMATIC IMAGE FILE NAME
================================= */

function imageName(name){

return "images/"+name
.toLowerCase()
.replace(/&/g,"and")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")+".jpg";

}

/* =================================
   CART
================================= */

let cart=[];
let currentCategory="All";

/* =================================
   DISPLAY PRODUCTS
================================= */

function displayProducts(list){

const box=document.getElementById("products");

box.innerHTML=list.map(product=>{

const index=products.indexOf(product);

return `
<div class="card">

<img
src="${imageName(product[0])}"
alt="${product[0]}"
onerror="this.src='images/no-image.jpg'"
>

<div class="info">

<div class="cat">${product[2]}</div>

<div class="name">${product[0]}</div>

<div class="price">
R${product[1].toFixed(2)}
</div>

<button
class="add"
onclick="addToCart(${index})"
>
Add to Cart
</button>

</div>
</div>
`;

}).join("");

}

/* =================================
   FILTER
================================= */

function filterProducts(category){

currentCategory=category;
searchProducts();

}

/* =================================
   SEARCH
================================= */

function searchProducts(){

const text=
document.getElementById("search")
.value
.toLowerCase();

const list=products.filter(product=>{

const categoryMatch=
currentCategory==="All" ||
product[2]===currentCategory;

const searchMatch=
product[0]
.toLowerCase()
.includes(text);

return categoryMatch && searchMatch;

});

displayProducts(list);

}

document
.getElementById("search")
.addEventListener(
"input",
searchProducts
);

/* =================================
   ADD TO CART
================================= */

function addToCart(index){

cart.push(index);

updateCart();

openCart();

}

/* =================================
   UPDATE CART
================================= */

function updateCart(){

const box=document.getElementById("items");

let total=0;

if(cart.length===0){

box.innerHTML="<p>Your cart is empty.</p>";

}else{

box.innerHTML=cart.map((index,position)=>{

const product=products[index];

total+=product[1];

return `
<div class="item">

<img
src="${imageName(product[0])}"
alt="${product[0]}"
>

<div>

<b>${product[0]}</b>

<br>

R${product[1].toFixed(2)}

<br>

<button
onclick="removeFromCart(${position})"
>
Remove
</button>

</div>

</div>
`;

}).join("");

}

document.getElementById("count")
.textContent=cart.length;

document.getElementById("total")
.textContent=total.toFixed(2);

}

/* =================================
   REMOVE FROM CART
================================= */

function removeFromCart(position){

cart.splice(position,1);

updateCart();

}

/* =================================
   OPEN CART
================================= */

function openCart(){

document
.getElementById("drawer")
.classList.add("open");

}

/* =================================
   CLOSE CART
================================= */

function closeCart(){

document
.getElementById("drawer")
.classList.remove("open");

}

/* =================================
   WHATSAPP
================================= */

function checkout(){

if(cart.length===0){

alert("Your cart is empty.");

return;

}

/*
CHANGE THIS NUMBER
TO YOUR AEROZONE WHATSAPP NUMBER.
Example:
27821234567
*/

const phone="27000000000";

let message=
"Hello AeroZone, I would like to order:%0A%0A";

let total=0;

cart.forEach(index=>{

const product=products[index];

message+=
"• "+product[0]+
" - R"+product[1].toFixed(2)+
"%0A";

total+=product[1];

});

message+=
"%0A*Total: R"+
total.toFixed(2)+"*";

window.open(
"https://wa.me/"+phone+
"?text="+message,
"_blank"
);

}

/* =================================
   START STORE
================================= */

displayProducts(products);

updateCart();

</script>
