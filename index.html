<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroZone | Online Store</title>

<style>
*{box-sizing:border-box}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#111;
}

header{
background:#111827;
color:white;
padding:15px;
position:sticky;
top:0;
z-index:10;
}

.top{
max-width:1200px;
margin:auto;
display:flex;
gap:12px;
align-items:center;
}

.logo{
font-size:25px;
font-weight:bold;
white-space:nowrap;
}

.search{
flex:1;
padding:12px;
border:0;
border-radius:7px;
font-size:15px;
outline:none;
}

button{
cursor:pointer;
border:0;
border-radius:7px;
padding:10px;
}

.cartBtn{
background:#f59e0b;
font-weight:bold;
white-space:nowrap;
}

nav{
background:white;
padding:10px;
overflow:auto;
white-space:nowrap;
box-shadow:0 1px 4px #ddd;
}

nav button{
margin:3px;
background:#eee;
}

nav button:hover,
nav button.active{
background:#111827;
color:white;
}

.hero{
max-width:1200px;
margin:20px auto;
padding:40px 20px;
background:#1f2937;
color:white;
border-radius:12px;
}

.hero h1{
font-size:38px;
margin:0 0 10px;
}

.container{
max-width:1200px;
margin:auto;
padding:10px 15px;
}

.products{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:15px;
min-height:200px;
}

.card{
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 2px 7px #ddd;
contain:layout;
}

.card img{
display:block;
width:100%;
height:180px;
object-fit:cover;
background:#eee;
}

.info{
padding:12px;
}

.cat{
font-size:12px;
color:#777;
margin-bottom:5px;
}

.name{
min-height:40px;
font-weight:bold;
line-height:20px;
}

.price{
font-size:20px;
font-weight:bold;
margin:8px 0;
}

.add{
width:100%;
background:#111827;
color:white;
font-weight:bold;
}

.add:hover{
background:#f59e0b;
color:#111;
}

.empty{
grid-column:1/-1;
background:white;
padding:40px;
text-align:center;
border-radius:10px;
}

.drawer{
position:fixed;
right:-400px;
top:0;
width:380px;
max-width:95%;
height:100%;
background:white;
z-index:20;
box-shadow:-5px 0 20px #999;
transition:right .25s ease;
display:flex;
flex-direction:column;
}

.drawer.open{
right:0;
}

.cartHead{
background:#111827;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
}

.cartHead h2{
margin:0;
}

.items{
flex:1;
overflow:auto;
padding:15px;
}

.item{
display:flex;
gap:10px;
border-bottom:1px solid #ddd;
padding:10px 0;
}

.item img{
width:60px;
height:60px;
object-fit:cover;
background:#eee;
flex-shrink:0;
}

.item div{
flex:1;
}

.remove{
margin-top:7px;
background:#eee;
font-size:12px;
}

.bottom{
padding:15px;
border-top:1px solid #ddd;
}

.checkout{
width:100%;
background:#16a34a;
color:white;
font-weight:bold;
font-size:16px;
}

footer{
background:#111827;
color:white;
text-align:center;
padding:25px;
margin-top:30px;
}

/* TABLET */
@media(max-width:1000px){
.products{
grid-template-columns:repeat(4,1fr);
}
}

/* PHONE */
@media(max-width:700px){

header{
padding:10px;
}

.top{
flex-wrap:wrap;
}

.logo{
font-size:22px;
}

.search{
order:3;
flex-basis:100%;
width:100%;
}

.hero{
margin:12px;
padding:30px 18px;
}

.hero h1{
font-size:28px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.card img{
height:150px;
}

.info{
padding:9px;
}

.name{
font-size:14px;
}

.price{
font-size:18px;
}

}
</style>
</head>

<body>

<header>

<div class="top">

<div class="logo">
AeroZone
</div>

<input
id="search"
class="search"
type="search"
placeholder="Search products..."
autocomplete="off">

<button
class="cartBtn"
onclick="openCart()">
🛒 Cart (<span id="count">0</span>)
</button>

</div>

</header>


<nav id="categoryNav">

<button class="active" onclick="filterCategory('All',this)">
All
</button>

<button onclick="filterCategory('Electronics',this)">
Electronics
</button>

<button onclick="filterCategory('Home',this)">
Home
</button>

<button onclick="filterCategory('Automotive',this)">
Automotive
</button>

<button onclick="filterCategory('Kitchen',this)">
Kitchen
</button>

<button onclick="filterCategory('Beauty',this)">
Beauty
</button>

<button onclick="filterCategory('Pets',this)">
Pets
</button>

<button onclick="filterCategory('Outdoor',this)">
Outdoor
</button>

<button onclick="filterCategory('Travel',this)">
Travel
</button>

</nav>


<section class="hero">

<h1>
Shop Smart with AeroZone
</h1>

<p>
Trending products at great prices.
</p>

</section>


<main class="container">

<h2>
Products
</h2>

<div
id="products"
class="products">
</div>

</main>


<!-- CART -->

<div
id="drawer"
class="drawer">

<div class="cartHead">

<h2>
🛒 Your Cart
</h2>

<button onclick="closeCart()">
✕
</button>

</div>


<div
id="items"
class="items">
</div>


<div class="bottom">

<h2>
Total: R<span id="total">0.00</span>
</h2>

<button
class="checkout"
onclick="checkout()">
Order on WhatsApp
</button>

</div>

</div>


<footer>

<h2>
AeroZone
</h2>

<p>
Online shopping made simple.
</p>

<p>
© 2026 AeroZone
</p>

</footer>


<script>

/* =====================================================

   ONLY EDIT THIS LIST TO ADD OR CHANGE PRODUCTS
===================================================== */

const products = [

["Facial Cleansing Brush",229,"Beauty"],

["Travel Neck Pillow",179,"Travel"],

["Travel Toiletry Bag",199,"Travel"],
["Travel Duffel Bag",299,"Travel"],
["Portable Travel Door Lock",179,"Travel"],
["Compression Travel Bags",149,"Travel"]

];


/* =====================================================
   IMAGE FILE NAME
===================================================== */

function imageName(name){

return "images/" +

name
.toLowerCase()
.replace(/&/g,"and")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")

+ ".jpg";

}


/* =====================================================
   CART
===================================================== */

let cart = [];

let category = "All";


/* =====================================================
   LOAD CART
===================================================== */

try{

cart = JSON.parse(
localStorage.getItem("aerozone-cart")
) || [];

}catch(e){

cart=[];

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(){

localStorage.setItem(
"aerozone-cart",
JSON.stringify(cart)
);

}


/* =====================================================
   SHOW PRODUCTS
===================================================== */

function show(list){

const box =
document.getElementById("products");


if(!list.length){

box.innerHTML =
'<div class="empty">No products found.</div>';

return;

}


/*
   IMPORTANT:
   We store the REAL product index.
   This prevents the wrong product
   being added after search/filter.
*/

box.innerHTML = list.map(index => {

const p = products[index];

return `

<div class="card">

<img
src="${imageName(p[0])}"
alt="${p[0]}"
loading="lazy"
onerror="this.onerror=null;this.src='images/no-image.jpg';">

<div class="info">

<div class="cat">
${p[2]}
</div>

<div class="name">
${p[0]}
</div>

<div class="price">
R${Number(p[1]).toFixed(2)}
</div>

<button
class="add"
onclick="add(${index})">

Add to Cart

</button>

</div>

</div>

`;

}).join("");

}


/* =====================================================
   FILTER + SEARCH
===================================================== */

function refreshProducts(){

const q =
document
.getElementById("search")
.value
.trim()
.toLowerCase();


const list = [];


products.forEach((p,index)=>{

const matchesCategory =
category === "All" ||
p[2] === category;


const matchesSearch =
p[0].toLowerCase().includes(q);


if(
matchesCategory &&
matchesSearch
){

list.push(index);

}

});


show(list);

}


/* =====================================================
   CATEGORY
===================================================== */

function filterCategory(c,button){

category=c;


/* remove active */

document
.querySelectorAll("#categoryNav button")
.forEach(btn=>{
btn.classList.remove("active");
});


/* add active */

button.classList.add("active");


refreshProducts();

}


/* =====================================================
   SEARCH
===================================================== */

document
.getElementById("search")
.addEventListener(
"input",
refreshProducts
);


/* =====================================================
   ADD TO CART
===================================================== */

function add(index){

cart.push(index);

saveCart();

updateCart();

openCart();

}


/* =====================================================
   UPDATE CART
===================================================== */

function updateCart(){

const items =
document.getElementById("items");


let total=0;


if(!cart.length){

items.innerHTML =
"<p>Your cart is empty.</p>";

}
else{

items.innerHTML =
cart.map((index,n)=>{

const p=products[index];

total += Number(p[1]);


return `

<div class="item">

<img
src="${imageName(p[0])}"
alt="${p[0]}"
onerror="this.onerror=null;this.src='images/no-image.jpg';">

<div>

<b>
${p[0]}
</b>

<br>

R${Number(p[1]).toFixed(2)}

<br>

<button
class="remove"
onclick="removeItem(${n})">

Remove

</button>

</div>

</div>

`;

}).join("");

}


/* count */

document
.getElementById("count")
.textContent=cart.length;


/* total */

document
.getElementById("total")
.textContent=total.toFixed(2);

}


/* =====================================================
   REMOVE
===================================================== */

function removeItem(n){

cart.splice(n,1);

saveCart();

updateCart();

}


/* =====================================================
   OPEN CART
===================================================== */

function openCart(){

document
.getElementById("drawer")
.classList.add("open");

}


/* =====================================================
   CLOSE CART
===================================================== */

function closeCart(){

document
.getElementById("drawer")
.classList.remove("open");

}


/* =====================================================
   WHATSAPP CHECKOUT
===================================================== */

function checkout(){

if(!cart.length){

alert("Your cart is empty.");

return;

}


/*
   CHANGE THIS NUMBER
   TO YOUR AEROZONE WHATSAPP NUMBER.

   South Africa example:
   27821234567
*/

const phone =
"27000000000";


let message =
"Hello AeroZone, I want to order:%0A%0A";


cart.forEach(index=>{

const p=products[index];

message +=
encodeURIComponent(
p[0] + " - R" +
Number(p[1]).toFixed(2)
)
+
"%0A";

});


const total =
cart.reduce(
(sum,index)=>
sum + Number(products[index][1]),
0
);


message +=
"%0ATotal: R" +
total.toFixed(2);


window.open(
"https://wa.me/" +
phone +
"?text=" +
message,
"_blank"
);

}


/* =====================================================
   START WEBSITE
===================================================== */

refreshProducts();

updateCart();

</script>

</body>
</html>
