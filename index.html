<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroZone | Online Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}
header{background:#111827;color:white;padding:15px;position:sticky;top:0;z-index:10}
.top{max-width:1200px;margin:auto;display:flex;gap:12px;align-items:center}
.logo{font-size:25px;font-weight:bold}.search{flex:1;padding:12px;border:0;border-radius:7px}
button{cursor:pointer;border:0;border-radius:7px;padding:10px}
.cartBtn{background:#f59e0b;font-weight:bold}
nav{background:white;padding:10px;overflow:auto;white-space:nowrap}
nav button{margin:3px;background:#eee}
nav button:hover{background:#111827;color:white}
.hero{max-width:1200px;margin:20px auto;padding:40px 20px;background:#1f2937;color:white;border-radius:12px}
.hero h1{font-size:38px;margin:0 0 10px}
.container{max-width:1200px;margin:auto;padding:10px 15px}
.products{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}
.card{background:white;border-radius:10px;overflow:hidden;box-shadow:0 2px 7px #ddd}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.info{padding:12px}.cat{font-size:12px;color:#777}.name{height:40px;font-weight:bold}
.price{font-size:20px;font-weight:bold;margin:8px 0}
.add{width:100%;background:#111827;color:white}.add:hover{background:#f59e0b;color:#111}
.drawer{position:fixed;right:-400px;top:0;width:380px;max-width:95%;height:100%;background:white;z-index:20;box-shadow:-5px 0 20px #999;transition:.3s;display:flex;flex-direction:column}
.drawer.open{right:0}.cartHead{background:#111827;color:white;padding:15px;display:flex;justify-content:space-between}
.items{flex:1;overflow:auto;padding:15px}.item{display:flex;gap:10px;border-bottom:1px solid #ddd;padding:10px 0}
.item img{width:60px;height:60px;object-fit:cover}.item div{flex:1}
.bottom{padding:15px;border-top:1px solid #ddd}.checkout{width:100%;background:#16a34a;color:white;font-weight:bold}
footer{background:#111827;color:white;text-align:center;padding:25px;margin-top:30px}
@media(max-width:1000px){.products{grid-template-columns:repeat(4,1fr)}}
@media(max-width:700px){.products{grid-template-columns:repeat(2,1fr)}.top{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
</style>
</head>

<body>

<button class="cartBtn" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>

<nav>
<button onclick="filter('All')">All</button>

<button onclick="filter('Kitchen')">Kitchen</button>

<button onclick="filter('Pets')">Pets</button>
<button onclick="filter('Outdoor')">Outdoor</button>
<button onclick="filter('Travel')">Travel</button>

<section class="hero">

<div id="drawer" class="drawer">

</div>
<div id="items" class="items"></div>
<div class="bottom">
<h2>Total: R<span id="total">0.00</span></h2>
<button class="checkout" onclick="checkout()">Order on WhatsApp</button>

</div>

<footer>

/* =========================
   AUTOMATIC IMAGE NAME
========================= */

function imageName(name){
return "images/"+name
.toLowerCase()
.replace(/&/g,"and")
.replace(/[^a-z0-9]+/g,"-")
.replace(/^-|-$/g,"")+".jpg";
}

let cart=[];
let category="All";

function show(list){
document.getElementById("products").innerHTML=list.map((p,i)=>`
<div class="card">
<img src="${imageName(p[0])}" alt="${p[0]}"
onerror="this.src='images/no-image.jpg'">
<div class="info">
<div class="cat">${p[2]}</div>
<div class="name">${p[0]}</div>
<div class="price">R${p[1].toFixed(2)}</div>
<button class="add" onclick="add(${i})">Add to Cart</button>
</div>
</div>`).join("");
}

function filter(c){
category=c;
search();
}

function search(){
let q=document.getElementById("search").value.toLowerCase();
let list=products.map((p,i)=>[...p,i])
.filter(p=>
(category=="All"||p[2]==category)&&
p[0].toLowerCase().includes(q)
);
show(list.map(p=>products[p[3]]));
}

document.getElementById("search").oninput=search;

function add(i){
cart.push(i);
update();
openCart();
}

function update(){
let total=0;
document.getElementById("items").innerHTML=cart.map((i,n)=>{
let p=products[i];total+=p[1];
return `<div class="item">
<img src="${imageName(p[0])}">
<div><b>${p[0]}</b><br>R${p[1]}
<button onclick="removeItem(${n})">Remove</button></div>
</div>`;
}).join("");
document.getElementById("count").textContent=cart.length;
document.getElementById("total").textContent=total.toFixed(2);
}

function removeItem(n){
cart.splice(n,1);
update();
}

function openCart(){
document.getElementById("drawer").classList.add("open");
}

function closeCart(){
document.getElementById("drawer").classList.remove("open");
}

function checkout(){
if(!cart.length)return alert("Your cart is empty.");

let phone="27000000000";
let msg="Hello AeroZone, I want to order:%0A%0A";

cart.forEach(i=>{
let p=products[i];
msg+=p[0]+" - R"+p[1]+"%0A";
});

msg+="%0ATotal: R"+cart.reduce((s,i)=>s+products[i][1],0).toFixed(2);

window.open("https://wa.me/"+phone+"?text="+msg,"_blank");
}

show(products);
