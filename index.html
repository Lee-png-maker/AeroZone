<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AeroZone | Premium Shopping & Delivery</title>

<style>
*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#fff;
color:#111;
}

button,
input{
font:inherit;
}

button{
cursor:pointer;
border:0;
}

/* ================= HEADER ================= */

header{
background:#050505;
color:#fff;
position:sticky;
top:0;
z-index:100;
box-shadow:0 3px 15px rgba(0,0,0,.18);
}

.header{
max-width:1250px;
margin:auto;
padding:14px 18px;
display:flex;
align-items:center;
gap:14px;
}

.logo{
font-size:25px;
font-weight:900;
letter-spacing:-1px;
white-space:nowrap;
}

.logo span{
font-weight:400;
}

.search{
flex:1;
height:42px;
border:1px solid #333;
border-radius:24px;
padding:0 18px;
outline:none;
background:#fff;
color:#111;
}

.search:focus{
border-color:#aaa;
}

.cart-btn{
background:#fff;
color:#111;
border-radius:24px;
padding:11px 18px;
font-weight:bold;
white-space:nowrap;
}

/* ================= QUICK MENU ================= */

.quick{
background:#fff;
border-bottom:1px solid #e5e5e5;
padding:9px 15px;
display:flex;
gap:8px;
overflow-x:auto;
white-space:nowrap;
}

.quick button{
background:#f3f3f3;
color:#111;
padding:9px 16px;
border-radius:20px;
font-size:13px;
}

.quick button:hover,
.quick button.active{
background:#111;
color:#fff;
}

/* ================= HERO ================= */

.hero{
max-width:1250px;
margin:18px auto;
padding:48px 28px;
border-radius:18px;
background:#080808;
color:#fff;
position:relative;
overflow:hidden;
}

.hero:after{
content:"";
position:absolute;
right:-100px;
top:-100px;
width:300px;
height:300px;
border:1px solid #444;
border-radius:50%;
}

.hero h1{
font-size:42px;
margin:0 0 10px;
letter-spacing:-1px;
}

.hero p{
color:#ccc;
font-size:17px;
margin-bottom:24px;
}

.delivery-box{
display:flex;
gap:8px;
max-width:680px;
position:relative;
z-index:2;
}

.delivery-box input{
flex:1;
height:45px;
padding:0 15px;
border-radius:8px;
border:0;
outline:none;
}

.delivery-box button{
background:#fff;
color:#111;
padding:0 20px;
border-radius:8px;
font-weight:bold;
}

/* ================= CONTAINER ================= */

.container{
max-width:1250px;
margin:auto;
padding:0 18px;
}

.section-title{
display:flex;
align-items:center;
justify-content:space-between;
margin:28px 0 14px;
}

.section-title h2{
margin:0;
font-size:22px;
}

.section-title span{
font-size:13px;
color:#777;
}

/* ================= STORES ================= */

.stores{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.store{
background:#fff;
border:1px solid #e5e5e5;
border-radius:14px;
padding:20px;
text-align:center;
transition:.2s;
}

.store:hover{
transform:translateY(-3px);
box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.store-icon{
width:65px;
height:65px;
margin:auto auto 10px;
border-radius:50%;
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
}

.store-name{
font-size:17px;
font-weight:bold;
}

.store-text{
font-size:13px;
color:#777;
margin:6px 0 13px;
}

.store button{
background:#111;
color:#fff;
padding:9px 18px;
border-radius:7px;
font-size:13px;
}

/* ================= CATEGORIES ================= */

.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding-bottom:5px;
}

.categories button{
background:#fff;
border:1px solid #ddd;
padding:10px 16px;
border-radius:22px;
white-space:nowrap;
}

.categories button.active,
.categories button:hover{
background:#111;
color:#fff;
border-color:#111;
}

/* ================= PRODUCTS ================= */

.products{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:16px;
padding-bottom:35px;
}

.product{
background:#fff;
border:1px solid #e5e5e5;
border-radius:13px;
overflow:hidden;
transition:.2s;
position:relative;
}

.product:hover{
transform:translateY(-4px);
box-shadow:0 10px 28px rgba(0,0,0,.10);
}

.product-image{
height:155px;
background:#f3f3f3;
display:flex;
align-items:center;
justify-content:center;
font-size:58px;
}

.product-info{
padding:13px;
}

.product-name{
font-weight:bold;
font-size:15px;
min-height:38px;
}

.product-store{
font-size:12px;
color:#777;
margin:5px 0;
}

.price{
font-size:20px;
font-weight:900;
margin:8px 0;
}

.add{
width:100%;
background:#111;
color:#fff;
padding:11px;
border-radius:7px;
font-weight:bold;
}

.add:hover{
background:#333;
}

.empty{
grid-column:1/-1;
padding:40px;
text-align:center;
border:1px solid #ddd;
border-radius:12px;
color:#777;
}

/* ================= CART ================= */

.cart{
position:fixed;
right:-440px;
top:0;
width:420px;
max-width:95%;
height:100vh;
background:#fff;
z-index:200;
box-shadow:-10px 0 35px rgba(0,0,0,.25);
transition:right .25s ease;
display:flex;
flex-direction:column;
}

.cart.open{
right:0;
}

.cart-header{
background:#050505;
color:#fff;
padding:16px;
display:flex;
align-items:center;
justify-content:space-between;
}

.cart-header h2{
margin:0;
font-size:20px;
}

.close{
background:#fff;
color:#111;
width:35px;
height:35px;
border-radius:50%;
font-weight:bold;
}

.cart-items{
flex:1;
overflow:auto;
padding:15px;
}

.cart-item{
display:flex;
gap:10px;
padding:13px 0;
border-bottom:1px solid #eee;
}

.cart-icon{
width:55px;
height:55px;
background:#f2f2f2;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:27px;
flex-shrink:0;
}

.cart-details{
flex:1;
}

.qty{
display:flex;
align-items:center;
gap:8px;
margin-top:8px;
}

.qty button{
width:28px;
height:28px;
border-radius:5px;
background:#eee;
}

.remove{
background:none;
color:#777;
font-size:12px;
padding:3px;
}

.checkout{
padding:15px;
border-top:1px solid #ddd;
background:#fff;
}

.row{
display:flex;
justify-content:space-between;
margin:8px 0;
}

.total{
font-size:22px;
font-weight:bold;
}

.checkout-address{
width:100%;
height:44px;
padding:0 12px;
border:1px solid #ddd;
border-radius:7px;
outline:none;
margin:9px 0;
}

.whatsapp{
width:100%;
background:#111;
color:#fff;
padding:13px;
border-radius:7px;
font-weight:bold;
}

.whatsapp:hover{
background:#333;
}

/* ================= FOOTER ================= */

footer{
background:#050505;
color:#fff;
padding:40px 20px;
margin-top:10px;
text-align:center;
}

footer h2{
margin:0 0 8px;
}

footer p{
color:#aaa;
font-size:13px;
}

/* ================= MOBILE ================= */

@media(max-width:1050px){

.products{
grid-template-columns:repeat(4,1fr);
}

.stores{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:700px){

.header{
flex-wrap:wrap;
padding:10px;
}

.logo{
font-size:21px;
}

.search{
order:3;
flex-basis:100%;
}

.hero{
margin:12px;
padding:32px 18px;
}

.hero h1{
font-size:30px;
}

.hero p{
font-size:14px;
}

.delivery-box{
flex-direction:column;
}

.delivery-box input,
.delivery-box button{
height:43px;
}

.stores{
grid-template-columns:repeat(2,1fr);
gap:9px;
}

.store{
padding:15px 8px;
}

.store-icon{
width:50px;
height:50px;
font-size:24px;
}

.store-name{
font-size:14px;
}

.store-text{
font-size:11px;
}

.store button{
font-size:11px;
padding:8px 12px;
}

.products{
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.product-image{
height:125px;
font-size:48px;
}

.product-info{
padding:9px;
}

.product-name{
font-size:13px;
}

.product-store{
font-size:11px;
}

.price{
font-size:17px;
}

.add{
font-size:12px;
padding:10px 5px;
}

.section-title h2{
font-size:19px;
}

.cart{
width:390px;
}

}
</style>
</head>

<body>

<!-- HEADER -->

<header>

<div class="header">

<div class="logo">
Aero<span>Zone</span> ◈
</div>

<input
id="search"
class="search"
type="search"
placeholder="Search products, food and stores..."
autocomplete="off">

<button
class="cart-btn"
onclick="openCart()">

🛒 Cart (<span id="cartCount">0</span>)

</button>

</div>

</header>
