<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0066ff">

  <title>AeroZone | Shop Smart. Shop Better.</title>
  <meta name="description" content="AeroZone online store - tech, home, car accessories, beauty, pets, outdoor and travel products.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
      line-height: 1.5;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .topbar {
      background: #005bea;
      color: white;
      text-align: center;
      padding: 8px 15px;
      font-size: 13px;
      font-weight: bold;
    }

    header {
      background: white;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .header-main {
      max-width: 1400px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      color: #005bea;
      white-space: nowrap;
    }

    .logo span {
      color: #111827;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 14px 50px 14px 18px;
      border: 1px solid #d8dee9;
      border-radius: 8px;
      outline: none;
      font-size: 15px;
      background: #f8fafc;
    }

    .search-box input:focus {
      border-color: #005bea;
      background: white;
    }

    .search-icon {
      position: absolute;
      right: 17px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 19px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-btn {
      border: none;
      background: #f1f5f9;
      padding: 11px 14px;
      border-radius: 8px;
      font-weight: bold;
      color: #172033;
    }

    .header-btn:hover {
      background: #e5eaf2;
    }

    .cart-button {
      position: relative;
      background: #005bea;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 17px;
      font-weight: bold;
    }

    .cart-count {
      position: absolute;
      right: -7px;
      top: -8px;
      background: #ff3b30;
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
    }

    /* =========================
       CATEGORY NAV
    ========================= */

    .category-bar {
      background: white;
      border-top: 1px solid #edf0f4;
      overflow-x: auto;
    }

    .categories {
      max-width: 1400px;
      margin: auto;
      padding: 10px 20px;
      display: flex;
      gap: 8px;
      white-space: nowrap;
    }

    .category-btn {
      border: none;
      background: transparent;
      padding: 9px 14px;
      border-radius: 20px;
      color: #475569;
      font-size: 13px;
      font-weight: bold;
    }

    .category-btn:hover,
    .category-btn.active {
      background: #005bea;
      color: white;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      max-width: 1400px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .hero-box {
      min-height: 300px;
      border-radius: 18px;
      padding: 45px;
      display: flex;
      align-items: center;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(110deg, #005bea, #00a8ff);
      color: white;
    }

    .hero-box::after {
      content: "🛍️";
      position: absolute;
      right: 7%;
      font-size: 170px;
      opacity: 0.16;
    }

    .hero-content {
      max-width: 620px;
      position: relative;
      z-index: 2;
    }

    .hero-content small {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      padding: 7px 12px;
      border-radius: 20px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .hero h1 {
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.05;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      opacity: 0.94;
      margin-bottom: 25px;
    }

    .hero-btn {
      border: none;
      background: white;
      color: #005bea;
      padding: 13px 22px;
      border-radius: 8px;
      font-weight: 800;
    }

    .hero-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       FEATURES
    ========================= */

    .features {
      max-width: 1400px;
      margin: 0 auto 25px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .feature {
      background: white;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .feature-icon {
      font-size: 27px;
    }

    .feature strong {
      display: block;
      font-size: 14px;
    }

    .feature span {
      font-size: 12px;
      color: #64748b;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .store {
      max-width: 1400px;
      margin: auto;
      padding: 0 20px 50px;
    }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 20px 0;
      gap: 15px;
    }

    .section-heading h2 {
      font-size: 25px;
    }

    .result-count {
      color: #64748b;
      font-size: 13px;
    }

    .sort-select {
      padding: 9px 12px;
      border: 1px solid #d8dee9;
      border-radius: 7px;
      background: white;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 15px;
    }

    .product-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid #e9edf3;
      transition: transform 0.2s, box-shadow 0.2s;
      min-width: 0;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.10);
    }

    .product-image {
      height: 210px;
      position: relative;
      background: linear-gradient(135deg, #eef4ff, #f8fafc);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .image-fallback {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .image-fallback .emoji {
      font-size: 70px;
      display: block;
      margin-bottom: 8px;
    }

    .wishlist {
      position: absolute;
      right: 10px;
      top: 10px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      font-size: 18px;
      z-index: 5;
    }

    .wishlist.active {
